name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 第一次部署时自动把 Pages 打开，省得再去 Settings 里点一遍
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web:static
        env:
          # 静态站仍然只把聊天存本机；语音 / 搜索走这个免费代理。
          # 如果代理项目名变了，在仓库 Variables 里改 LINIAN_API_BASE 即可。
          VITE_API_BASE: ${{ vars.LINIAN_API_BASE || 'https://linian-proxy.peach303.deno.net/api/v1' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
